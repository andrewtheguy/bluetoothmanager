[package]
name = "bluetoothmanager"
version = "0.0.1"
edition = "2024"
description = "A terminal Bluetooth manager that drives BlueZ over D-Bus"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "signal"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
